# The public site at https://myspa.co.ke
#
# DocumentRoot is the `current` symlink, which deploy/deploy.sh flips atomically
# to a new release directory. Apache follows it per request, so a deploy takes
# effect immediately with no reload and no downtime.
#
# All the interesting behaviour (canonical host, trailing slashes, serving the
# prerendered page for a clean URL, caching, the real 404) lives in the site's
# own public/.htaccess, which ships inside each release. AllowOverride All is
# what lets that file work, so do not tighten it without moving those rules here.
#
# Install:
#   sudo a2enmod rewrite headers deflate expires ssl
#   sudo cp deploy/apache/myspa.co.ke.conf /etc/apache2/sites-available/
#   sudo a2ensite myspa.co.ke
#   sudo certbot --apache -d myspa.co.ke -d www.myspa.co.ke
#   sudo systemctl reload apache2

<VirtualHost *:80>
  ServerName  myspa.co.ke
  ServerAlias www.myspa.co.ke

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^(.*)$ https://myspa.co.ke$1 [R=301,L]

  ErrorLog  ${APACHE_LOG_DIR}/myspa-error.log
  CustomLog ${APACHE_LOG_DIR}/myspa-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName  myspa.co.ke
  ServerAlias www.myspa.co.ke

  SSLEngine on

  DocumentRoot /var/www/myspa/current

  <Directory /var/www/myspa/current>
    # FollowSymLinks is required: DocumentRoot is itself a symlink into
    # releases/, and that is what makes an atomic deploy possible.
    Options -Indexes +FollowSymLinks

    # public/.htaccess carries the canonical-host redirect, the clean-URL
    # rewrite onto the prerendered index.html files, and the cache headers.
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog  ${APACHE_LOG_DIR}/myspa-error.log
  CustomLog ${APACHE_LOG_DIR}/myspa-access.log combined
</VirtualHost>
</IfModule>
