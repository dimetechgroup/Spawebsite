# Directus admin UI and API at https://cms.myspa.co.ke
#
# Directus itself listens only on 127.0.0.1:8055 (see directus/docker-compose.yml),
# so this vhost is the only route in. Postgres is never proxied.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo cp deploy/apache/cms.myspa.co.ke.conf /etc/apache2/sites-available/
#   sudo a2ensite cms.myspa.co.ke
#   sudo certbot --apache -d cms.myspa.co.ke     # adds the :443 vhost and certs
#   sudo systemctl reload apache2

<VirtualHost *:80>
  ServerName cms.myspa.co.ke

  # certbot rewrites this once it has issued a certificate. Until then it lets
  # the ACME HTTP-01 challenge through.
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^(.*)$ https://cms.myspa.co.ke$1 [R=301,L]

  ErrorLog  ${APACHE_LOG_DIR}/cms-error.log
  CustomLog ${APACHE_LOG_DIR}/cms-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName cms.myspa.co.ke

  # certbot fills in SSLCertificateFile / SSLCertificateKeyFile here.
  SSLEngine on

  ProxyPreserveHost On
  ProxyRequests Off

  # Directus builds absolute URLs from PUBLIC_URL, but it still needs to know
  # the original scheme for cookie flags and redirects.
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  ProxyPass        / http://127.0.0.1:8055/
  ProxyPassReverse / http://127.0.0.1:8055/

  # Image uploads. Raise if editors work with larger originals; Directus's own
  # limit is set by FILES_MAX_UPLOAD_SIZE.
  LimitRequestBody 52428800

  # The admin UI is a private tool, so keep it out of search results entirely.
  Header always set X-Robots-Tag "noindex, nofollow"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "same-origin"
  Header always set Strict-Transport-Security "max-age=31536000"

  # A long-running import or a slow upload should not be cut off mid-request.
  ProxyTimeout 300

  ErrorLog  ${APACHE_LOG_DIR}/cms-error.log
  CustomLog ${APACHE_LOG_DIR}/cms-access.log combined
</VirtualHost>
</IfModule>
