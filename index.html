<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Defaults. Per-route values are upserted at runtime by components/Seo.tsx
       and baked into each prerendered page by scripts/prerender.mjs. -->
  <title>Spa Management Software in Kenya | MySpa</title>
  <meta name="description"
    content="MySpa is all-in-one spa and salon management software for Kenyan businesses. Run bookings, POS, inventory, CRM and reports from one system. From KES 3,000/month." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://myspa.co.ke/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MySpa" />
  <meta property="og:locale" content="en_KE" />
  <meta property="og:title" content="Spa Management Software in Kenya | MySpa" />
  <meta property="og:description"
    content="All-in-one spa and salon management software for Kenyan businesses. Run bookings, POS, inventory, CRM and reports from one system." />
  <meta property="og:image" content="https://myspa.co.ke/images/Dashboard.png" />
  <meta property="og:url" content="https://myspa.co.ke/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spa Management Software in Kenya | MySpa" />
  <meta name="twitter:description"
    content="All-in-one spa and salon management software for Kenyan businesses. Run bookings, POS, inventory, CRM and reports from one system." />
  <meta name="twitter:image" content="https://myspa.co.ke/images/Dashboard.png" />

  <!-- Browser-tab icons, generated from the brand mark in /images/MYSPA.png.
       The full wordmark is 877x297, so it is unreadable in a ~16px tab slot;
       these are cropped to the face-and-dots mark and padded square.
       Regenerate with `bash scripts/generate-favicons.sh` if the logo changes. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#207D40" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

</body>

</html>
